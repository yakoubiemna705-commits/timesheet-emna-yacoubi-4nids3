#Server configuration
server.servlet.context-path=/timesheet-devops
server.port=8082

### DATABASE ###
spring.datasource.url=jdbc:mysql://mysqldb:3306/timesheet_devops_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### JPA / HIBERNATE ###
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

#logging configuration
logging.level.root=INFO
logging.level.org.springframework=warn
